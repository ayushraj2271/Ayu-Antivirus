name: Build Ayu Antivirus APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract uploaded project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)
          if [ -z "${ZIP_FILE:-}" ]; then
            echo 'ERROR: No .zip project file was found in the repository.'
            echo 'Upload the Ayu Antivirus project ZIP to the repository root.'
            exit 1
          fi
          echo "Using ZIP: $ZIP_FILE"
          rm -rf _ayu_source
          mkdir -p _ayu_source
          unzip -q "$ZIP_FILE" -d _ayu_source
          echo 'Extracted project files:'
          find _ayu_source -maxdepth 3 -type f | sort | head -100

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS=$(find _ayu_source -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)
          if [ -z "${SETTINGS:-}" ]; then
            echo 'ERROR: settings.gradle/settings.gradle.kts was not found inside the uploaded ZIP.'
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android app module was not found in $PROJECT_DIR/app"
            exit 1
          fi
          echo "Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ayu-antivirus-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
